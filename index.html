// 节点状态自动计算
function autoCalcNodeStatus(node){
    const now = new Date();
    now.setHours(0,0,0,0);
    if(node.actualDate) return "completed";
    if(!node.estimatedDate) return "notStarted";
    const plan = new Date(node.estimatedDate);
    plan.setHours(0,0,0,0);
    return plan < now ? "delayed" : "inProgress";
}

function getStatusClass(s){
    const map = {
        notStarted:"node-notStarted",
        inProgress:"node-inProgress",
        completed:"node-completed",
        delayed:"node-delayed"
    };
    return map[s]||map.notStarted;
}
function getStatusIcon(s){
    const map = {
        notStarted:'<i class="fa fa-circle-o"></i>',
        inProgress:'<i class="fa fa-play"></i>',
        completed:'<i class="fa fa-check"></i>',
        delayed:'<i class="fa fa-exclamation-triangle"></i>'
    };
    return map[s]||map.notStarted;
}

// 本地数据读写
function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
}
function loadLocalData(){
    const local = localStorage.getItem(STORAGE_KEY);
    projects = local ? JSON.parse(local) : JSON.parse(JSON.stringify(defaultData));
}

// 云端同步
async function pullFromGithub(){
    try{
        const res = await fetch(GH_CFG.rawUrl + "?t=" + Date.now(), {cache:"no-store"});
        if(!res.ok) throw new Error("文件读取失败");
        const json = await res.json();
        if(!Array.isArray(json)) throw new Error("数据格式错误");
        projects = json;
        saveData();
        render();
        alert("✅ 同步成功：已拉取云端数据");
    }catch(e){
        alert("❌ 拉取失败："+e.message);
        loadLocalData();
        render();
    }
}
async function pushToGithub(){
    if(!GH_CFG.token){
        alert("请先配置 GitHub 个人访问令牌");
        return;
    }
    try{
        const headers = {
            "Authorization": "token " + GH_CFG.token,
            "Content-Type": "application/json",
            "User-Agent": "Mozilla/5.0"
        };
        let sha = "";
        // 先获取文件 sha
        const getRes = await fetch(GH_CFG.apiUrl, {headers, cache: "no-store"});
        if(getRes.ok){
            const fileInfo = await getRes.json();
            sha = fileInfo.sha;
        }
        // 标准 UTF-8 转 Base64，修复旧编码兼容问题
        const jsonStr = JSON.stringify(projects,null,2);
        const uint8 = new TextEncoder().encode(jsonStr);
        const content = btoa(String.fromCharCode(...uint8));

        const putRes = await fetch(GH_CFG.apiUrl, {
            method: "PUT",
            headers: headers,
            body: JSON.stringify({
                message: "数据自动更新 " + new Date().toLocaleString(),
                content: content,
                sha: sha
            })
        });
        if(!putRes.ok) {
            const err = await putRes.json();
            throw new Error(err.message || "请求返回异常");
        }
        alert("✅ 上传成功：数据已保存至云端");
    }catch(e){
        console.error(e);
        alert("❌ 上传失败："+e.message);
    }
}

function isProjectCompleted(proj){
    return proj.nodes.every(n=>autoCalcNodeStatus(n)==='completed');
}

// 页面渲染
function render(){
    const active = projects.filter(p=>!isProjectCompleted(p));
    const completed = projects.filter(p=>isProjectCompleted(p));
    document.getElementById("active-projects-container").innerHTML = renderList(active, false);
    document.getElementById("completed-projects-container").innerHTML = renderList(completed, true);

    const wrap = document.getElementById("completed-projects-container");
    isCompletedCollapsed ? wrap.classList.add('collapsed-card') : wrap.classList.remove('collapsed-card');
    bindEvents();
}

function renderList(list,isCompleted){
    if(list.length===0) return `<div style="text-align:center;padding:40px;color:#999;">暂无${isCompleted?'已完成':'进行中'}项目</div>`;
    let html = "";
    list.forEach(proj=>{
        const activeNode = proj.nodes.find(n=>n.id===proj.activeNodeId);
        let nodeHtml = "";
        proj.nodes.forEach(node=>{
            const st = autoCalcNodeStatus(node);
            const isActive = node.id === proj.activeNodeId;
            let delayTxt = node.delayDays>0 ? `<div class="delay-txt">延期${node.delayDays}天</div>` : '';
            nodeHtml += `
            <div class="timeline-node" data-pid="${proj.id}" data-nid="${node.id}">
                <div class="node-icon ${getStatusClass(st)}">${getStatusIcon(st)}</div>
                <div class="node-text">
                    <div>${node.name}</div>
                    <div style="font-size:12px;color:#666;">${node.estimatedDate||'-'}</div>
                    ${node.actualDate?`<div style="font-size:12px;color:#8CC152;">${node.actualDate}</div>`:''}
                    ${delayTxt}
                </div>
                ${isActive?'<div class="node-arrow"></div>':''}
            </div>`;
        });

        let taskHtml = "";
        activeNode.subtasks.forEach((task,idx)=>{
            taskHtml += `
            <div class="task-item">
                <i class="fa fa-square-o"></i>
                <div class="editable" data-type="task" data-pid="${proj.id}" data-nid="${activeNode.id}" data-tidx="${idx}">${task}</div>
            </div>`;
        });

        html += `
        <div class="project-card ${isCompleted&&isCompletedCollapsed?'collapsed-card':''}">
            <button class="delete-btn" data-pid="${proj.id}"><i class="fa fa-trash"></i></button>
            <div class="card-row">
                <div class="card-left">
                    <div class="project-name editable" data-type="projName" data-pid="${proj.id}">${proj.name}</div>
                    <div class="img-container">
                        <img src="${proj.image}" alt="">
                        <div class="img-upload">
                            <button class="upload-img-btn" data-pid="${proj.id}"><i class="fa fa-upload"></i> 上传</button>
                        </div>
                    </div>
                </div>
                <div class="card-right">
                    <div class="timeline-wrap">${nodeHtml}</div>
                    <div class="task-wrap">
                        <h4 class="task-title">${activeNode.name} — 子任务</h4>
                        <div class="task-list">${taskHtml}</div>
                        <div class="add-task add-task-btn" data-pid="${proj.id}" data-nid="${activeNode.id}"><i class="fa fa-plus"></i> 添加子任务</div>
                    </div>
                </div>
            </div>
        </div>`;
    });
    return html;
}

// 元素事件绑定
function bindEvents(){
    let clickTimer = null;
    document.querySelectorAll(".timeline-node").forEach(el=>{
        el.onclick = function(){
            const pid = +this.dataset.pid, nid = +this.dataset.nid;
            clickTimer = setTimeout(()=>{
                const p = projects.find(x=>x.id===pid);
                if(p){
                    p.activeNodeId = nid;
                    saveData(); render();
                }
            },250);
        };
        el.ondblclick = e=>{
            e.stopPropagation();
            const pid = +el.dataset.pid, nid = +el.dataset.nid;
            editTarget = {pid,nid};
            const node = projects.find(x=>x.id===pid).nodes.find(x=>x.id===nid);
            document.getElementById('modalPlanDate').value = node.estimatedDate||'';
            document.getElementById('modalActualDate').value = node.actualDate||'';
            document.getElementById('modalDelayDay').value = node.delayDays||0;
            document.getElementById('modalDelayToDate').value = node.delayToDate||'';
            document.getElementById('editModal').classList.remove('hide');
        };
    });

    document.querySelectorAll(".editable").forEach(el=>{
        el.ondblclick = function(){
            const oldVal = this.textContent.trim();
            const input = document.createElement("input");
            input.style.width = "100%";
            input.style.padding = "4px";
            input.value = oldVal;
            this.replaceWith(input);
            input.focus();
            const done = ()=>{
                const newVal = input.value.trim()||oldVal;
                const pid = +this.dataset.pid;
                const p = projects.find(x=>x.id===pid);
                if(p.name) p.name = newVal;
                saveData(); render();
            };
            input.onblur = done;
            input.onkeydown = e=>e.key==="Enter"&&done();
        };
    });

    document.querySelectorAll(".add-task-btn").forEach(btn=>{
        btn.onclick = function(){
            const pid = +this.dataset.pid, nid = +this.dataset.nid;
            const p = projects.find(x=>x.id===pid);
            const nd = p.nodes.find(x=>x.id===nid);
            nd.subtasks.push("新子任务");
            saveData(); render();
        };
    });

    document.querySelectorAll(".upload-img-btn").forEach(btn=>{
        btn.onclick = e=>{
            e.stopPropagation();
            currentUploadProjId = +btn.dataset.pid;
            document.getElementById("imgUpload").click();
        };
    });

    document.querySelectorAll(".delete-btn").forEach(btn=>{
        btn.onclick = function(){
            if(confirm("确定删除该项目？")){
                projects = projects.filter(p=>p.id!==+this.dataset.pid);
                saveData(); render();
            }
        };
    });
}

function createNewProject(name,imgUrl){
    const newId = projects.length ? Math.max(...projects.map(p=>p.id))+1 : 1;
    const nodes = JSON.parse(JSON.stringify(defaultData[0].nodes));
    projects.push({
        id:newId,
        name:name,
        image:imgUrl||`https://picsum.photos/seed/proj${newId}/400/300`,
        nodes:nodes,
        activeNodeId:1
    });
    saveData(); render();
}

// 全局事件绑定
function bindGlobalEvents(){
    document.getElementById('syncDataBtn').onclick = pullFromGithub;
    document.getElementById('syncDataBtn').addEventListener('contextmenu',e=>{
        e.preventDefault();
        if(confirm('确定上传覆盖云端 data.json？')) pushToGithub();
    });

    document.getElementById('toggleCompletedBtn').onclick = ()=>{
        isCompletedCollapsed = !isCompletedCollapsed;
        const txt = document.getElementById('toggleText');
        const icon = document.querySelector('#toggleCompletedBtn i');
        txt.textContent = isCompletedCollapsed?'展开':'折叠';
        icon.className = isCompletedCollapsed?'fa fa-chevron-up':'fa fa-chevron-down';
        render();
    };

    document.getElementById('addProjectBtn').onclick = ()=>{
        document.getElementById('newProjectName').value = '';
        document.getElementById('newProjectImage').value = '';
        document.getElementById('addProjectModal').classList.remove('hide');
    };
    document.getElementById('addProjectCancel').onclick = ()=>{
        document.getElementById('addProjectModal').classList.add('hide');
    };
    document.getElementById('addProjectConfirm').onclick = ()=>{
        const name = document.getElementById('newProjectName').value.trim();
        if(!name){alert("请输入项目名称");return;}
        const file = document.getElementById('newProjectImage').files[0];
        if(file){
            const reader = new FileReader();
            reader.onload = function(){
                createNewProject(name,reader.result);
                document.getElementById('addProjectModal').classList.add('hide');
            };
            reader.readAsDataURL(file);
        }else{
            createNewProject(name);
            document.getElementById('addProjectModal').classList.add('hide');
        }
    };

    document.getElementById('modalCancel').onclick = ()=>{
        document.getElementById('editModal').classList.add('hide');
    };
    document.getElementById('modalConfirm').onclick = ()=>{
        const {pid,nid} = editTarget;
        const p = projects.find(x=>x.id===pid);
        const nd = p.nodes.find(x=>x.id===nid);
        nd.estimatedDate = document.getElementById('modalPlanDate').value;
        nd.actualDate = document.getElementById('modalActualDate').value;
        nd.delayDays = parseInt(document.getElementById('modalDelayDay').value)||0;
        nd.delayToDate = document.getElementById('modalDelayToDate').value;
        saveData(); render();
        document.getElementById('editModal').classList.add('hide');
    };

    document.getElementById("imgUpload").onchange = function(e){
        const file = e.target.files[0];
        if(!file||!file.type.startsWith("image/"))return;
        const reader = new FileReader();
        reader.onload = function(){
            const p = projects.find(x=>x.id===currentUploadProjId);
            if(p){
                p.image = reader.result;
                saveData(); render();
            }
        };
        reader.readAsDataURL(file);
        this.value = "";
    };
}
</script>
