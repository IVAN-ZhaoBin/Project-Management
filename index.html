// 自动计算节点状态
function autoCalcNodeStatus(node){
    const now = new Date();
    now.setHours(0,0,0,0);
    if(node.actualDate) return "completed";
    if(!node.estimatedDate) return "notStarted";
    const plan = new Date(node.estimatedDate);
    plan.setHours(0,0,0,0);
    return plan < now ? "delayed" : "inProgress";
}
function getStatusClass(s){
    const map = {notStarted:"bg-node-notStarted",inProgress:"bg-node-inProgress",completed:"bg-node-completed",delayed:"bg-node-delayed"};
    return map[s]||map.notStarted;
}
function getStatusIcon(s){
    const map = {
        notStarted:'<i class="fa fa-circle-o text-white"></i>',
        inProgress:'<i class="fa fa-play text-white"></i>',
        completed:'<i class="fa fa-check text-white"></i>',
        delayed:'<i class="fa fa-exclamation-triangle text-white"></i>'
    };
    return map[s]||map.notStarted;
}

// 本地数据读写
function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
}
function loadLocalData(){
    const local = localStorage.getItem(STORAGE_KEY);
    projects = local ? JSON.parse(local) : JSON.parse(JSON.stringify(defaultData));
}

// 拉取云端数据
async function pullFromGithub(){
    try{
        const res = await fetch(GH_CFG.rawUrl + "?t=" + Date.now(), {cache:"no-store"});
        if(!res.ok) throw new Error("文件读取失败");
        const json = await res.json();
        if(!Array.isArray(json)) throw new Error("数据格式错误");
        projects = json;
        saveData();
        render();
        alert("✅ 同步成功：已拉取云端数据");
    }catch(e){
        alert("❌ 拉取失败："+e.message);
        loadLocalData();
        render();
    }
}

// 上传数据到云端
async function pushToGithub(){
    if(!GH_CFG.token){
        alert("请先配置 GitHub 个人访问令牌");
        return;
    }
    try{
        const headers = {
            "Authorization": "token " + GH_CFG.token,
            "Content-Type": "application/json"
        };
        let sha = "";
        const getRes = await fetch(GH_CFG.apiUrl, {headers});
        if(getRes.ok){
            const fileInfo = await getRes.json();
            sha = fileInfo.sha;
        }
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(projects,null,2))));
        const putRes = await fetch(GH_CFG.apiUrl, {
            method: "PUT",
            headers: headers,
            body: JSON.stringify({
                message: "数据自动更新 " + new Date().toLocaleString(),
                content: content,
                sha: sha
            })
        });
        if(!putRes.ok) throw new Error("上传请求失败");
        alert("✅ 上传成功：数据已保存至云端");
    }catch(e){
        alert("❌ 上传失败："+e.message);
    }
}

// 判断项目是否完成
function isProjectCompleted(proj){
    return proj.nodes.every(n=>autoCalcNodeStatus(n)==='completed');
}

// 页面渲染
function render(){
    const active = projects.filter(p=>!isProjectCompleted(p));
    const completed = projects.filter(p=>isProjectCompleted(p));
    document.getElementById("active-projects-container").innerHTML = renderList(active, false);
    document.getElementById("completed-projects-container").innerHTML = renderList(completed, true);

    const wrap = document.getElementById("completed-projects-container");
    isCompletedCollapsed ? wrap.classList.add('collapsed-card') : wrap.classList.remove('collapsed-card');
    bindEvents();
}

function renderList(list,isCompleted){
    if(list.length===0) return `<div class="text-center py-8 text-gray-500">暂无${isCompleted?'已完成':'进行中'}项目</div>`;
    let html = "";
    list.forEach(proj=>{
        const activeNode = proj.nodes.find(n=>n.id===proj.activeNodeId);
        let nodeHtml = "";
        proj.nodes.forEach(node=>{
            const st = autoCalcNodeStatus(node);
            const isActive = node.id === proj.activeNodeId;
            let delayTxt = node.delayDays>0 ? `<div class="text-xs text-red-600">延期${node.delayDays}天</div>` : '';
            nodeHtml += `
            <div class="timeline-node relative flex-shrink-0 w-[100px] p-2.5 rounded-lg shadow cursor-pointer ${isActive?'ring-2 ring-primary ring-offset-2'}">
                <div class="w-9 h-9 ${getStatusClass(st)} rounded-full flex items-center justify-center mx-auto mb-2">
                    ${getStatusIcon(st)}
                </div>
                <div class="text-center text-sm">
                    <div class="font-medium">${node.name}</div>
                    <div class="text-xs text-gray-600">${node.estimatedDate||'-'}</div>
                    ${node.actualDate?`<div class="text-xs text-green-600">${node.actualDate}</div>`:''}
                    ${delayTxt}
                </div>
                ${isActive?'<div class="node-arrow"></div>':''}
            </div>`;
        });

        let taskHtml = "";
        activeNode.subtasks.forEach((task,idx)=>{
            taskHtml += `
            <div class="p-2 border-b border-gray-100">
                <div class="flex items-center">
                    <i class="fa fa-square-o text-gray-400 mr-3"></i>
                    <div class="editable" data-type="task" data-pid="${proj.id}" data-nid="${activeNode.id}" data-tidx="${idx}">${task}</div>
                </div>
            </div>`;
        });

        html += `
        <div class="project-card bg-white rounded-xl shadow overflow-hidden relative ${isCompleted&&isCompletedCollapsed?'collapsed-card':''}">
            <button class="delete-project-btn absolute top-4 right-4 text-danger hover:text-red-800" data-pid="${proj.id}"><i class="fa fa-trash"></i> 删除</button>
            <div class="flex flex-col md:flex-row">
                <div class="w-full md:w-1/6 p-4 border-r border-gray-100">
                    <h3 class="text-lg font-bold editable mb-3" data-type="projName" data-pid="${proj.id}">${proj.name}</h3>
                    <div class="image-container relative rounded-lg overflow-hidden">
                        <img src="${proj.image}" class="w-full h-40 object-cover">
                        <div class="image-upload-overlay absolute inset-0 bg-black/50 flex items-center justify-center">
                            <button class="upload-img-btn bg-white text-primary px-3 py-1.5 rounded text-sm" data-pid="${proj.id}"><i class="fa fa-upload mr-1"></i>上传</button>
                        </div>
                    </div>
                </div>
                <div class="w-full md:w-5/6 p-4">
                    <div class="flex overflow-x-auto gap-2 pb-4">${nodeHtml}</div>
                    <div class="bg-primary/10 rounded-lg p-4">
                        <h4 class="text-lg font-medium mb-3 text-center">${activeNode.name} — 子任务</h4>
                        <div class="bg-white rounded-lg shadow-sm overflow-hidden">${taskHtml}</div>
                        <div class="mt-3 text-center">
                            <button class="add-task-btn text-primary text-sm" data-pid="${proj.id}" data-nid="${activeNode.id}"><i class="fa fa-plus mr-1"></i>添加子任务</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    });
    return html;
}

// 页面元素事件
function bindEvents(){
    let clickTimer = null;
    document.querySelectorAll(".timeline-node").forEach(el=>{
        el.onclick = function(){
            const pid = +this.dataset.pid, nid = +this.dataset.nid;
            clickTimer = setTimeout(()=>{
                const p = projects.find(x=>x.id===pid);
                if(p){
                    p.activeNodeId = nid;
                    saveData(); render();
                }
            },250);
        };
        el.ondblclick = e=>{
            e.stopPropagation();
            const pid = +el.dataset.pid, nid = +el.dataset.nid;
            editTarget = {pid,nid};
            const node = projects.find(x=>x.id===pid).nodes.find(x=>x.id===nid);
            planDate.value = node.estimatedDate||'';
            actualDate.value = node.actualDate||'';
            delayDay.value = node.delayDays||0;
            delayToDate.value = node.delayToDate||'';
            modal.classList.remove('hidden');
        };
    });

    document.querySelectorAll(".editable").forEach(el=>{
        el.ondblclick = function(){
            const oldVal = this.textContent.trim();
            const input = document.createElement("input");
            input.className = "w-full px-2 py-1 border border-primary rounded focus:outline-none";
            input.value = oldVal;
            this.replaceWith(input);
            input.focus();
            const done = ()=>{
                const newVal = input.value.trim()||oldVal;
                const pid = +this.dataset.pid;
                const p = projects.find(x=>x.id===pid);
                if(p.name) p.name = newVal;
                saveData(); render();
            };
            input.onblur = done;
            input.onkeydown = e=>e.key==="Enter"&&done();
        };
    });

    document.querySelectorAll(".add-task-btn").forEach(btn=>{
        btn.onclick = function(){
            const pid = +this.dataset.pid, nid = +this.dataset.nid;
            const p = projects.find(x=>x.id===pid);
            const nd = p.nodes.find(x=>x.id===nid);
            nd.subtasks.push("新子任务");
            saveData(); render();
        };
    });

    document.querySelectorAll(".upload-img-btn").forEach(btn=>{
        btn.onclick = e=>{
            e.stopPropagation();
            currentUploadProjId = +btn.dataset.pid;
            document.getElementById("imgUpload").click();
        };
    });

    document.querySelectorAll(".delete-project-btn").forEach(btn=>{
        btn.onclick = function(){
            if(confirm("确定删除该项目？")){
                projects = projects.filter(p=>p.id!==+this.dataset.pid);
                saveData(); render();
            }
        };
    });
}

// 新建项目
function createNewProject(name,imgUrl){
    const newId = projects.length ? Math.max(...projects.map(p=>p.id))+1 : 1;
    const nodes = JSON.parse(JSON.stringify(defaultData[0].nodes));
    projects.push({
        id:newId,
        name:name,
        image:imgUrl||`https://picsum.photos/seed/proj${newId}/400/300`,
        nodes:nodes,
        activeNodeId:1
    });
    saveData(); render();
}

// 全局事件绑定
function bindGlobalEvents(){
    document.getElementById('syncDataBtn').onclick = pullFromGithub;
    document.getElementById('syncDataBtn').addEventListener('contextmenu',e=>{
        e.preventDefault();
        if(confirm('确定上传覆盖云端 data.json？')) pushToGithub();
    });

    document.getElementById('toggleCompletedBtn').onclick = ()=>{
        isCompletedCollapsed = !isCompletedCollapsed;
        const txt = document.getElementById('toggleText');
        const icon = document.querySelector('#toggleCompletedBtn i');
        txt.textContent = isCompletedCollapsed?'展开':'折叠';
        icon.className = isCompletedCollapsed?'fa fa-chevron-up mr-1':'fa fa-chevron-down mr-1';
        render();
    };

    document.getElementById('addProjectBtn').onclick = ()=>{
        newProjectName.value = '';
        newProjectImage.value = '';
        addProjectModal.classList.remove('hidden');
    };
    addProjectCancel.onclick = ()=>addProjectModal.classList.add('hidden');
    addProjectConfirm.onclick = ()=>{
        const name = newProjectName.value.trim();
        if(!name){alert("请输入项目名称");return;}
        const file = newProjectImage.files[0];
        if(file){
            const reader = new FileReader();
            reader.onload = function(){
                createNewProject(name,reader.result);
                addProjectModal.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }else{
            createNewProject(name);
            addProjectModal.classList.add('hidden');
        }
    };

    modalCancel.onclick = ()=>modal.classList.add('hidden');
    modalConfirm.onclick = ()=>{
        const {pid,nid} = editTarget;
        const p = projects.find(x=>x.id===pid);
        const nd = p.nodes.find(x=>x.id===nid);
        nd.estimatedDate = planDate.value;
        nd.actualDate = actualDate.value;
        nd.delayDays = parseInt(delayDay.value)||0;
        nd.delayToDate = delayToDate.value;
        saveData(); render();
        modal.classList.add('hidden');
    };

    document.getElementById("imgUpload").onchange = function(e){
        const file = e.target.files[0];
        if(!file||!file.type.startsWith("image/"))return;
        const reader = new FileReader();
        reader.onload = function(){
            const p = projects.find(x=>x.id===currentUploadProjId);
            if(p){
                p.image = reader.result;
                saveData(); render();
            }
        };
        reader.readAsDataURL(file);
        this.value = "";
    };
}
</script>
